<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | escape }} · {{ site.title }}</title><meta name="description" content="{{ site.description | escape }}"><link rel="stylesheet" href="{{ '/style.css' | relative_url }}"><link rel="alternate" type="application/atom+xml" title="Florian’s reading notes" href="{{ '/feed.xml' | relative_url }}"><link rel="canonical" href="{{ page.url | absolute_url }}"></head>
<body><div class="wrap"><header><a class="name" href="{{ '/' | relative_url }}">Florian Cucurella</a><nav aria-label="Main"><a href="https://flocuc.github.io/">Home</a><a href="{{ '/' | relative_url }}">Blog</a><a href="{{ '/feed.xml' | relative_url }}">Feed</a></nav></header><main><article><h1>{{ page.title | escape }}</h1>{% if page.date %}<p class="date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y · %H:%M:%S UTC' }}</time></p>{% endif %}{{ content }}</article></main><footer><a href="https://github.com/flocuc">GitHub</a> · <a href="https://x.com/flocuc">X</a> · <a href="https://www.reddit.com/user/flocuc/">Reddit</a> · <a href="https://news.ycombinator.com/user?id=flocuc">Hacker News</a> · <a href="{{ '/' | relative_url }}">Blog</a><p>Reading, writing code, and thinking through small language ideas.</p></footer></div></body></html>
